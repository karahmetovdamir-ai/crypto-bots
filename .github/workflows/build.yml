name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip bitpulse-btc-trading-bot.zip -d extracted_project
        if [ -d "extracted_project/app" ]; then
          cp -r extracted_project/* .
        else
          cp -r extracted_project/*/* . 2>/dev/null || cp -r extracted_project/* .
        fi

    - name: Handle Missing Environment Files
      run: |
        # Создаем заглушку, чтобы проект не ругался при сборке
        touch .env.example
        touch .env
        if [ -d "app" ]; then
          touch app/.env.example 2>/dev/null || true
          touch app/.env 2>/dev/null || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: current

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: crypto-bot-app
        path: |
          **/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/app-debug.apk
